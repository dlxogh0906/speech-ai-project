<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#256abf;
  --s0:#f3f6fb; --s1:#cde2fb; --s2:#9ec5f4; --s3:#6da7ec; --s4:#3987e5; --s5:#256abf; --s6:#184f95; --s7:#0d366b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5;
  --s0:#1f1f1e; --s1:#10233f; --s2:#123963; --s3:#184f95; --s4:#256abf; --s5:#2a78d6; --s6:#3987e5; --s7:#5598e7;
}}
:root[data-theme=dark]{
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --accent:#3987e5;
  --s0:#1f1f1e; --s1:#10233f; --s2:#123963; --s3:#184f95; --s4:#256abf; --s5:#2a78d6; --s6:#3987e5; --s7:#5598e7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px;margin:0 0 22px}
table.allc{border-collapse:collapse;font-size:12.5px;width:100%}
table.allc th,table.allc td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:left;vertical-align:top}
table.allc th{color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--surface)}
table.allc td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.allc td.c{white-space:nowrap;font-weight:600}
table.allc .pt{display:inline-block;margin:1px 6px 1px 0;white-space:nowrap}
table.allc .pt small{color:var(--muted)}
.allwrap{max-height:70vh;overflow:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 18px 20px;margin:0 0 20px}
.ctrls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:6px}
label{font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--axis);border-radius:8px;padding:7px 10px;cursor:pointer}
select{min-width:230px}
button.toggle{padding:6px 12px}
button.toggle[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.summary{display:flex;flex-wrap:wrap;gap:10px 26px;margin:14px 2px 2px;font-size:13px;color:var(--ink2)}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:var(--s0);color:var(--ink2)}
.chip b{color:var(--ink)}
h2{font-size:15px;margin:26px 0 2px}
.htitle{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.htitle small{color:var(--muted);font-weight:400;font-size:12px}
.hmwrap{overflow-x:auto;padding-bottom:6px}
table.hm{border-collapse:separate;border-spacing:2px}
table.hm th{font-weight:600;color:var(--ink2);font-size:12px;padding:2px}
table.hm th.col{writing-mode:vertical-rl;transform:rotate(180deg);height:auto;vertical-align:bottom;font-variant-numeric:tabular-nums}
table.hm th.corner{color:var(--muted);font-size:10.5px;font-weight:500;text-align:right;vertical-align:bottom;padding-right:6px}
table.hm th.row{text-align:right;padding-right:8px;white-space:nowrap}
td.cell{width:30px;height:30px;text-align:center;border-radius:5px;font-size:11px;
  font-variant-numeric:tabular-nums;cursor:default;color:#fff;position:relative}
td.cell.empty{background:var(--s0);color:transparent;cursor:default}
td.rtot{color:var(--muted);font-size:11px;text-align:left;padding-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;align-items:center;gap:8px;margin:8px 2px 0;font-size:11.5px;color:var(--muted)}
.legend .bar{display:flex;height:11px;border-radius:3px;overflow:hidden;width:180px}
.legend .bar i{flex:1}
.ovwrap{overflow-x:auto}
table.ov{border-collapse:separate;border-spacing:2px;font-size:12px}
table.ov th.col{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--ink2);font-weight:600;padding:3px}
table.ov th.row{text-align:right;padding:2px 8px 2px 2px;white-space:nowrap;color:var(--ink2);cursor:pointer;font-weight:500}
table.ov th.row.sel{color:var(--ink);font-weight:700}
table.ov th.row:hover{color:var(--accent)}
table.ov td{width:44px;height:24px;text-align:center;border-radius:4px;color:#fff;
  font-variant-numeric:tabular-nums;cursor:pointer;font-size:11px}
table.ov tr.sel td{outline:2px solid var(--accent);outline-offset:-2px}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--surface);
  padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.45;max-width:240px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .08s}
.tip b{font-size:13px}
.tip .big{font-size:15px;font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:11.5px;margin-top:10px}
.tblview{display:none;margin-top:14px}
.tblview.on{display:block}
.tblview table{border-collapse:collapse;font-size:12px;width:100%}
.tblview th,.tblview td{border-bottom:1px solid var(--grid);padding:4px 8px;text-align:left}
.tblview td.n{text-align:right;font-variant-numeric:tabular-nums}
.hide{display:none!important}
</style></head><body>
<div class="wrap">
  <h1>__H1__</h1>
  <p class="sub">__SUB__</p>

  <div class="card">
    <div class="ctrls">
      <span><label for="csel">국적&nbsp;</label>
        <select id="csel"></select></span>
      <button class="toggle" id="tblbtn" aria-pressed="false">표로 보기</button>
      <button class="toggle" id="themebtn" aria-pressed="false">다크/라이트</button>
    </div>
    <div class="summary" id="sum"></div>
    <div class="chips" id="chips"></div>
    <div class="legend"><span>적음</span>
      <span class="bar"><i style="background:var(--s1)"></i><i style="background:var(--s2)"></i><i style="background:var(--s3)"></i><i style="background:var(--s4)"></i><i style="background:var(--s5)"></i><i style="background:var(--s6)"></i><i style="background:var(--s7)"></i></span>
      <span>많음 &nbsp;·&nbsp; 행=정답음소, 열=실제 발음한 음소 &nbsp;·&nbsp; 셀에 커서를 올리면 상세</span></div>
  </div>

  <div id="heatmaps"></div>

  <div class="tblview" id="tblview"></div>

  <h2>국적 × 오류유형 개요</h2>
  <p class="sub">__OVSUB__</p>
  <div class="card"><div class="ovwrap" id="ovwrap"></div></div>

  __ALLC__
  <p class="foot">__FOOT__</p>
</div>
<div class="tip" id="tip"></div>
<script>
const DATA = __DATA__;
const STOPS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7'];
const cs = getComputedStyle(document.documentElement);
function color(t){ // t in [0,1]
  const g = STOPS.map(v=>cs.getPropertyValue(v).trim());
  if(t<=0) return cs.getPropertyValue('--s0').trim();
  const x = Math.min(0.999, Math.sqrt(t))*(g.length-1);
  return g[Math.round(x)];
}
const tip = document.getElementById('tip');
function showTip(e,htmlStr){ tip.innerHTML=htmlStr; tip.style.opacity=1;
  let x=e.clientX+14, y=e.clientY+14;
  if(x+250>innerWidth) x=e.clientX-250; if(y+120>innerHeight) y=e.clientY-120;
  tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.opacity=0; }

const sel = document.getElementById('csel');
DATA.countries.forEach((c,i)=>{ const o=document.createElement('option');
  o.value=i; o.textContent=`${c.name} — ${c.en} (${c.total.toLocaleString()}건)`; sel.appendChild(o); });

function renderHeatmaps(ci){
  const c = DATA.countries[ci];
  const mats = DATA.matrices[c.key];
  const host = document.getElementById('heatmaps'); host.innerHTML='';
  document.getElementById('sum').innerHTML =
    `<span>선택: <b>${c.name}</b> (${c.en})</span><span>대치오류 총 <b>${c.total.toLocaleString()}</b>건</span>`;
  // chips: top5 대치
  let all=[]; DATA.positions.forEach(p=>mats[p].forEach(r=>all.push([p,...r])));
  all.sort((a,b)=>b[3]-a[3]);
  document.getElementById('chips').innerHTML = '<span class="chip">최다 대치 ▸</span>'+
    all.slice(0,6).map(r=>{const ax=DATA.axes[r[0]];
      return `<span class="chip"><b>${ax.targets[r[1]].ko}→${ax.actuals[r[2]].ko}</b> ${DATA.types[r[5]]} · ${r[3].toLocaleString()}</span>`;}).join('');

  DATA.positions.forEach(pos=>{
    const ax = DATA.axes[pos]; const rows=ax.targets, cols=ax.actuals;
    const cells = mats[pos];
    // grid + row totals
    const grid = Array.from({length:rows.length},()=>Array(cols.length).fill(null));
    const rtot = Array(rows.length).fill(0);
    let mx=1;
    cells.forEach(([r,co,n,sh,ty])=>{ grid[r][co]={n,sh,ty}; rtot[r]+=n; if(n>mx)mx=n; });
    // 등장한 행/열만
    const rused = rows.map((_,i)=>rtot[i]>0);
    const cused = cols.map((_,ci)=>cells.some(c=>c[1]===ci));
    if(!cells.length){ return; }
    const wrap=document.createElement('div');
    wrap.innerHTML=`<div class="htitle"><h2 style="margin:0">${pos} 오류</h2>
      <small>정답 ${rused.filter(Boolean).length}종 → 실현 ${cused.filter(Boolean).length}종 · 최다 셀 ${mx.toLocaleString()}건</small></div>`;
    const hw=document.createElement('div'); hw.className='hmwrap';
    const tb=document.createElement('table'); tb.className='hm';
    // header
    let thead='<tr><th class="corner">정답＼실현</th>';
    cols.forEach((c,ci)=>{ if(cused[ci]) thead+=`<th class="col">${c.ko}</th>`; });
    thead+='<th></th></tr>';
    let body='';
    rows.forEach((rw,ri)=>{ if(!rused[ri])return;
      body+=`<tr><th class="row">${rw.ko}</th>`;
      cols.forEach((cl,ci)=>{ if(!cused[ci])return;
        const cell=grid[ri][ci];
        if(!cell){ body+=`<td class="cell empty">·</td>`; return; }
        const t=cell.n/mx; const bg=color(t); const light=Math.sqrt(t)>0.55;
        const lbl = cell.n>=mx*0.28 ? cell.n : '';
        body+=`<td class="cell" data-b="${bg}" style="background:${bg};color:${light?'#fff':'var(--ink)'}"
          data-tip="<b>${rw.ko} → ${cl.ko}</b><br><span class='big'>${cell.n.toLocaleString()}건</span> · 비중 ${cell.sh}%<br>유형: ${DATA.types[cell.ty]} · ${rw.sym}→${cl.sym}">${lbl}</td>`;
      });
      body+=`<td class="rtot">${rtot[ri].toLocaleString()}</td></tr>`;
    });
    tb.innerHTML=thead+body; hw.appendChild(tb); wrap.appendChild(hw); host.appendChild(wrap);
  });
  // 셀 tooltip
  host.querySelectorAll('td.cell:not(.empty)').forEach(td=>{
    td.addEventListener('mousemove',e=>showTip(e,td.dataset.tip));
    td.addEventListener('mouseleave',hideTip);
  });
  buildTable(ci);
  // overview 선택 표시
  document.querySelectorAll('table.ov tr').forEach((tr,i)=>tr.classList.toggle('sel',i-1===ci));
  document.querySelectorAll('table.ov th.row').forEach((th,i)=>th.classList.toggle('sel',i===ci));
}

function buildTable(ci){
  const c=DATA.countries[ci], mats=DATA.matrices[c.key];
  let rows=[]; DATA.positions.forEach(p=>mats[p].forEach(r=>rows.push([p,...r])));
  rows.sort((a,b)=>b[3]-a[3]);
  let h=`<table><thead><tr><th>위치</th><th>정답</th><th>→ 실현</th><th>유형</th><th style="text-align:right">빈도</th><th style="text-align:right">비중%</th></tr></thead><tbody>`;
  rows.forEach(r=>{const ax=DATA.axes[r[0]];
    h+=`<tr><td>${r[0]}</td><td>${ax.targets[r[1]].ko} (${ax.targets[r[1]].sym})</td><td>${ax.actuals[r[2]].ko} (${ax.actuals[r[2]].sym})</td><td>${DATA.types[r[5]]}</td><td class="n">${r[3].toLocaleString()}</td><td class="n">${r[4]}</td></tr>`;});
  h+='</tbody></table>';
  document.getElementById('tblview').innerHTML=`<h2>표: ${c.name} 전체 대치 (${rows.length}종)</h2>`+h;
}

// 개요 히트맵
(function(){
  const T=DATA.types, ov=DATA.overview;
  let mx=1; ov.forEach(r=>r.forEach(v=>{if(v>mx)mx=v;}));
  let h='<table class="ov"><thead><tr><th></th>';
  T.forEach(t=>h+=`<th class="col">${t}</th>`); h+='</tr></thead><tbody>';
  DATA.countries.forEach((c,ci)=>{
    h+=`<tr data-ci="${ci}"><th class="row" data-ci="${ci}">${c.name}</th>`;
    ov[ci].forEach((v,ti)=>{const t=v/mx;const bg=color(t);const light=Math.sqrt(t)>0.55;
      h+=`<td data-ci="${ci}" data-b="${bg}" style="background:${bg};color:${light?'#fff':'var(--ink)'}"
        data-tip="<b>${c.name}</b><br>${T[ti]}<br><span class='big'>${v}%</span> of 대치오류">${v>=3?v:''}</td>`;});
    h+='</tr>';
  });
  h+='</tbody></table>';
  const w=document.getElementById('ovwrap'); w.innerHTML=h;
  w.querySelectorAll('[data-ci]').forEach(el=>{
    el.addEventListener('click',()=>{sel.value=el.dataset.ci; renderHeatmaps(+el.dataset.ci);
      window.scrollTo({top:0,behavior:'smooth'});});
  });
  w.querySelectorAll('td[data-tip]').forEach(td=>{
    td.addEventListener('mousemove',e=>showTip(e,td.dataset.tip));
    td.addEventListener('mouseleave',hideTip);
  });
})();

// controls
sel.addEventListener('change',()=>renderHeatmaps(+sel.value));
document.getElementById('tblbtn').addEventListener('click',function(){
  const on=this.getAttribute('aria-pressed')==='true'; this.setAttribute('aria-pressed',!on);
  document.getElementById('tblview').classList.toggle('on',!on);
  document.getElementById('heatmaps').classList.toggle('hide',!on);
});
document.getElementById('themebtn').addEventListener('click',function(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':(cur==='light'?'dark':'dark');
  document.documentElement.setAttribute('data-theme',next);
  this.setAttribute('aria-pressed', next==='dark');
  // 색 재계산
  const cs2=getComputedStyle(document.documentElement);
  document.querySelectorAll('[data-b]').forEach(el=>{}); // vars swap → 재렌더
  renderHeatmaps(+sel.value);
  rebuildOv();
});
function rebuildOv(){ /* 개요 색은 CSS var라 재렌더 불필요하지만 안전하게 */ }

renderHeatmaps(0);
</script>
</body></html>
