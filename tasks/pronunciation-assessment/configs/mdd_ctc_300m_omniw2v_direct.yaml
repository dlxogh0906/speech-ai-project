# @package _group_
# XLS-R-300m (raw) → TAG 전사자(강라벨, 자모) CTC 파인튜닝 = 자체개발 MDD
# record 트랙과 별개. 라벨=TAG 전사자(자모), 평가=TAG test.
common:
  fp16: true
  log_format: json
  log_interval: 100
  tensorboard_logdir: ${env:SPEECH_AI_DATA}/mdd_ckpt_omniw2v/tb

checkpoint:
  save_dir: ${env:SPEECH_AI_DATA}/mdd_ckpt_omniw2v
  no_epoch_checkpoints: true
  best_checkpoint_metric: loss
  save_interval_updates: 2000
  keep_interval_updates: 3
  patience: 10

task:
  _name: audio_finetuning
  data: ${env:MDD_OUTPUTS}/manifest_tag_all_native
  normalize: true
  labels: ltr                     # TAG 전사자(자모)

dataset:
  num_workers: 6
  max_tokens: 1600000
  skip_invalid_size_inputs_valid_test: true
  valid_subset: valid
  validate_interval_updates: 2000

distributed_training:
  ddp_backend: legacy_ddp
  distributed_world_size: 1

criterion:
  _name: ctc
  zero_infinity: true

optimization:
  max_update: 120000
  lr: [0.00003]
  sentence_avg: true
  update_freq: [4]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  phase_ratio: [0.1, 0.4, 0.5]
  final_lr_scale: 0.05

model:
  _name: wav2vec_ctc
  w2v_path: ${env:SPEECH_AI_DATA}/models_omni/omniASR-W2V-300M-fairseq1.pt   # 2025 omniASR (변환본)
  apply_mask: true
  mask_prob: 0.5
  mask_channel_prob: 0.5
  mask_channel_length: 64
  layerdrop: 0.1
  activation_dropout: 0.1
  feature_grad_mult: 0.0
  freeze_finetune_updates: 10000
