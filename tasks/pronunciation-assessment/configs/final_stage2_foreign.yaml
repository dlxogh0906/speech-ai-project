# @package _group_
#
# FINAL Stage 2 — Stage 1 best 에서 외국인 TAG 실제 발음으로 파인튜닝 (2026-09-15)
# ─────────────────────────────────────────────────────────────────────
#   초기화   Stage 1 checkpoint_best.pt — 가중치만 이어받고 옵티마이저·LR·스텝·이터레이터는 새로 시작
#            실행 시 지정: checkpoint.restore_file=$SPEECH_AI_DATA/checkpoints/final_stage1_kspon/checkpoint_best.pt
#   데이터   manifest_foreign_clean_v2 (TAG 실제 발음 · cap1000 · LAR 없음 · 46자모)
#   lr       1e-5 (Stage 1 의 1/3) · tri_stage · 인코더 동결 없음(이미 한국어로 학습됨)
#   스텝     최대 5,000 · 1k 마다 검증(valid_unseen, valid)·저장, 전부 보존
#   선택     fairseq best 는 참고용. FINAL 은 1k~5k 체크포인트를 valid_unseen 에서 greedy 디코드해
#            JER 최소 → 동률(소수 4자리)이면 되돌림 낮은 것 → 보존 높은 것 (scripts/eval/select_final_ckpt.py)
common:
  fp16: true
  log_format: json
  log_interval: 100
  seed: 42
  tensorboard_logdir: ${env:SPEECH_AI_DATA}/checkpoints/final_stage2_foreign/tb
checkpoint:
  save_dir: ${env:SPEECH_AI_DATA}/checkpoints/final_stage2_foreign
  best_checkpoint_metric: uer
  maximize_best_checkpoint_metric: false
  save_interval_updates: 1000
  keep_interval_updates: -1
  no_epoch_checkpoints: true
  reset_optimizer: true
  reset_lr_scheduler: true
  reset_meters: true
  reset_dataloader: true
task:
  _name: audio_finetuning
  data: ${env:MDD_OUTPUTS}/manifest_foreign_clean_v2
  normalize: true
  labels: ltr
dataset:
  num_workers: 6
  max_tokens: 1600000
  skip_invalid_size_inputs_valid_test: true
  valid_subset: valid_unseen,valid
  validate_interval_updates: 1000
distributed_training:
  distributed_world_size: 1
  ddp_backend: legacy_ddp
criterion:
  _name: ctc
  zero_infinity: true
optimization:
  max_update: 5000
  lr: [0.00001]
  sentence_avg: true
  update_freq: [4]
optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08
lr_scheduler:
  _name: tri_stage
  phase_ratio: [0.1, 0.4, 0.5]
  final_lr_scale: 0.05
model:
  _name: wav2vec_ctc
  w2v_path: ${env:SPEECH_AI_MODELS}/xlsr2_300m.pt
  apply_mask: true
  mask_prob: 0.5
  mask_channel_prob: 0.5
  mask_channel_length: 64
  layerdrop: 0.1
  activation_dropout: 0.1
  feature_grad_mult: 0.0
  freeze_finetune_updates: 0
