# @package _group_
#
# 지름길 차단 — 운영 규모 (2026-08-02)
# ─────────────────────────────────────────────────────────────────────
# 목적: 암기 가설의 실측 확정/기각.
#   train 은 257 문장, test 는 학습에서 완전히 뺀 30 문장.
#   이 모델은 그 30 문장을 한 번도 보지 않는다 → 미학습 문장 성능을 잴 수 있다.
#   (기존 tag_all_lar 체크포인트는 287 종을 모두 학습했으므로 이 실험에 못 쓴다)
#
# ⚠️ 이건 **진단용 축약 레시피**다. 운영 모델 재현용이 아니다.
#   **운영 레시피 그대로다** — max_update 50,000 · freeze_finetune_updates 10,000.
#   앞선 20k 축약 실험(mdd_ctc_300m_diverse1000)과 달리 절대 수치를 tag_all_lar 과 비교할 수 있다.
#   목적 둘: (1) 배포 후보 모델  (2) 운영 규모에서의 미학습 문장 성능 — 아직 아무도 모르는 숫자.
#
#   LAR 단계는 넣지 않았다. 오늘 실측상 LAR 은 오발음 검출에 효과가 0이고
#   (tag_all 58.9% vs tag_all_lar 59.0%), manifest_tag_all_lar 은 287문장 전체를 포함해
#   홀드아웃 30종을 오염시킨다. 채택되면 그때 diverse 기반 LAR 매니페스트로 15k 추가하면 된다.
#
# 디스크: /data 여유가 45G 뿐이고 체크포인트 1개가 3.79GB 라 보존 개수를 제한한다.

common:
  fp16: true
  log_format: json
  log_interval: 200
  tensorboard_logdir: ${env:SPEECH_AI_DATA}/mdd_ckpt_diverse50k/tb

checkpoint:
  save_dir: ${env:SPEECH_AI_DATA}/mdd_ckpt_diverse50k
  best_checkpoint_metric: loss
  save_interval_updates: 5000
  keep_interval_updates: 1        # 디스크 보호 — 최근 1개만
  keep_last_epochs: 1
  no_epoch_checkpoints: true

task:
  _name: audio_finetuning
  data: ${env:MDD_OUTPUTS}/manifest_diverse_cap1000
  normalize: true
  labels: ltr                     # TAG = 화자가 실제로 발음한 형태

dataset:
  num_workers: 6
  max_tokens: 1600000
  skip_invalid_size_inputs_valid_test: true
  valid_subset: valid
  validate_interval_updates: 2000

distributed_training:
  distributed_world_size: 1
  ddp_backend: legacy_ddp

criterion:
  _name: ctc
  zero_infinity: true

optimization:
  max_update: 50000
  lr: [0.00003]
  sentence_avg: true
  update_freq: [4]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  phase_ratio: [0.1, 0.4, 0.5]
  final_lr_scale: 0.05

model:
  _name: wav2vec_ctc
  w2v_path: ${env:SPEECH_AI_MODELS}/xlsr2_300m.pt   # 밑바닥부터. warm-start 안 함
  apply_mask: true
  mask_prob: 0.5
  mask_channel_prob: 0.5
  mask_channel_length: 64
  layerdrop: 0.1
  activation_dropout: 0.1
  feature_grad_mult: 0.0
  freeze_finetune_updates: 10000
