<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>국적 모델 비교</title>
<style>
:root{--bg:#0f1420;--card:#1a2232;--tx:#e6ecf7;--sub:#8fa1bf;--ac:#5b9dff;--ok:#39d98a;--bd:#2a3550;--warn:#ffb454}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Pretendard',system-ui,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lbl{color:var(--sub);font-size:13px}
input[type=file]{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--sub);font-weight:600}
td.k{font-variant-numeric:tabular-nums;text-align:right}
.korea{color:var(--ok);font-weight:700}.foreign{color:var(--warn);font-weight:700}
.pill{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--sub);margin-left:6px}
.bar{height:6px;border-radius:3px;background:#233049;overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--ok)}
#st{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>국적 분류 · 만든 모델 전부 비교</h1>
  <div class="sub" id="sub">모델 로딩 중…</div>
  <div class="card">
    <div class="row">
      <button id="rec">🎙 녹음 시작</button>
      <span class="lbl">또는</span><input type="file" id="file" accept="audio/*">
      <label class="lbl"><input type="checkbox" id="norm" checked> 무음 정규화 (데모 8922 와 동일)</label>
    </div>
    <div class="lbl" id="st">한국어로 문장 하나를 읽거나 자유롭게 말해 보세요 (최대 12초).</div>
  </div>
  <div class="card" id="res" style="display:none">
    <div class="lbl" id="meta"></div>
    <table><thead><tr><th>모델</th><th>1위</th><th>2위</th><th>3위</th><th style="text-align:right">Korea 확률</th><th style="text-align:right">처리</th></tr></thead><tbody id="tb"></tbody></table>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
function refreshHealth(){fetch('health').then(r=>r.json()).then(h=>{
  if(h.loading){$('#sub').textContent='모델 로딩 중… (2B 세 개 포함, 4~6분) — 로드된 모델 '+h.models.length+'개';setTimeout(refreshHealth,5000);return}
  if(h.error){$('#sub').textContent='로딩 실패: '+h.error;return}
  $('#sub').textContent=h.models.length+'개 모델 준비됨 · '+h.models.map(m=>m.name.split(' ')[0]).join(' · ');
}).catch(()=>setTimeout(refreshHealth,5000))}
refreshHealth();
function cell(t){return t?`${t.label} <span class="k">${(t.prob*100).toFixed(1)}%</span>`:''}
function show(d){
  $('#res').style.display='';
  $('#meta').textContent=`입력 ${d.sec}s · 무음 정규화 ${d.norm?'켬':'끔'} · 전체 ${d.total_ms} ms`;
  const tb=$('#tb');tb.innerHTML='';
  d.results.forEach(r=>{const tr=document.createElement('tr');const top=r.top5[0];
    tr.innerHTML=`<td>${r.name}<span class="pill">${r.type==='2b'?'2B · '+r.device:'300m · CPU'}</span></td>
      <td class="${top.label==='Korea'?'korea':'foreign'}">${cell(top)}</td><td>${cell(r.top5[1])}</td><td>${cell(r.top5[2])}</td>
      <td class="k">${(r.korea*100).toFixed(1)}%<div class="bar"><i style="width:${r.korea*100}%"></i></div></td><td class="k">${r.ms} ms</td>`;
    tb.appendChild(tr)});
}
async function predictBlob(blob){
  $('#st').textContent='분석 중… (모델 8개)';
  const f=new FormData();f.append('audio',blob,'a.webm');
  const r=await fetch('predict?norm='+($('#norm').checked?1:0),{method:'POST',body:f});const d=await r.json();
  if(d.error){$('#st').textContent='⚠ '+d.error;return}
  $('#st').textContent='완료';show(d);
}
let mr=null,chunks=[];
$('#rec').onclick=async()=>{
  if(mr&&mr.state==='recording'){mr.stop();return}
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];mr=new MediaRecorder(st);mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());$('#rec').textContent='🎙 녹음 시작';predictBlob(new Blob(chunks))};
  mr.start();$('#rec').textContent='⏹ 정지';$('#st').textContent='녹음 중… (정지를 누르면 분석)';
};
$('#file').onchange=e=>{if(e.target.files[0])predictBlob(e.target.files[0])};
</script>
</body>
</html>
